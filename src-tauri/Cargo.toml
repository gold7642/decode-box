[package]
name = "phone-decrypt-tool"
version = "0.1.0"
description = "手机号解密工具：log/md5/sha256 密文批量解密，追加解密列"
authors = ["marketing-tools"]
edition = "2021"

[lib]
name = "phone_decrypt_tool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
tonic-build = "0.13"
prost-build = "0.13"
protox = "0.7"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tonic = { version = "0.13", default-features = false, features = ["transport", "prost", "codegen"] }
prost = "0.13"
calamine = "0.28"
rust_xlsxwriter = { version = "0.79", features = ["constant_memory", "zlib"] }
csv = "1.3"
encoding_rs = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
tokio-util = "0.7"

[profile.release]
lto = true
codegen-units = 1
strip = true
